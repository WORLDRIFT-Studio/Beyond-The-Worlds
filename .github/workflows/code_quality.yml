name: code_quality.yml
on: [push, pull_request, workflow_dispatch]
jobs:
  run_reformat:
    runs-on: ubuntu-latest
    name: Check code
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
      - name: Restore
        run: dotnet restore "Beyond The Worlds.sln"
      - name: Tool Restore
        run: dotnet tool restore
      - name: Check Analyzers
        run: dotnet format "Beyond The Worlds.sln" --verify-no-changes
      - name: Check Formating
        run: dotnet csharpier check .
      - name: Build solution
        run: dotnet build "Beyond The Worlds.sln" --no-restore
